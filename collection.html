<script>const bundledIds=[...document.querySelectorAll('#color-games [data-puzzle-id]')].map(card=>card.dataset.puzzleId);
Promise.all([StackRuntime.ready.catch(()=>{}),StackWeekly.load(bundledIds)]).then(()=>{/* Display colors only: puzzle values, clues and saved progress stay unchanged. */
(function(root){
  'use strict';
  const grayscale=['#ffffff','#aaaaaa','#555555','#000000'];
  const palettes={
    ocean:['#f1faf7','#9cdbd2','#368faa','#183e57'],
    berry:['#fff5ed','#f5b8bc','#bd647e','#513951'],
    forest:['#faf9e9','#bfd49a','#649b70','#294c45'],
    caramel:['#fff8e8','#eacb91','#b68157','#503f39'],
    twilight:['#faf5fc','#d2bde8','#9572bc','#403955'],
    sunset:['#fff8e9','#f1cf93','#d7876c','#6a4756']
  };
  function paletteFor(puzzle={}){
    const approved=puzzle.colorPalette||puzzle.source?.colorPalette;
    if(Array.isArray(approved)&&approved.length===4&&approved.every(value=>/^#[0-9a-f]{6}$/i.test(value)))return approved.slice();
    const subject=puzzle.subject||puzzle.source?.subject||'',category=puzzle.categoryId||puzzle.source?.categoryId;
    const key=/펭귄|고래|상어|돌고래|눈|빙수/.test(subject)?'ocean':
      /고양이|리본|딸기|체리/.test(subject)?'berry':
      /유령|마녀|마법|요정|우주/.test(subject)?'twilight':
      /석양|로켓|불/.test(subject)?'sunset':
      ({'01':'caramel','02':'forest','03':'ocean','04':'forest','05':'berry','06':'caramel','07':'berry','08':'ocean','09':'twilight','10':'ocean','11':'forest','12':'ocean','13':'caramel','14':'ocean','15':'twilight'}[category]||'ocean');
    return palettes[key];
  }
  const colors=(puzzle,mode)=>mode==='color'?paletteFor(puzzle):grayscale;
  function foreground(hex){
    const [r,g,b]=hex.slice(1).match(/../g).map(v=>parseInt(v,16)/255).map(v=>v<=.04045?v/12.92:((v+.055)/1.055)**2.4);
    return .2126*r+.7152*g+.0722*b>.179?'#202522':'#ffffff';
  }
  function readMode(){try{return (globalThis.StackStorage||localStorage).getItem('nonogram-playtest-v1-mode')==='monochrome'?'monochrome':'color';}catch{return 'color';}}
  function writeMode(mode){try{(globalThis.StackStorage||localStorage).setItem('nonogram-playtest-v1-mode',mode);}catch{}}
  const api={grayscale,palettes,paletteFor,colors,foreground,readMode,writeMode};
  if(typeof module!=='undefined')module.exports=api;
  root.StackPalette=api;
})(typeof globalThis!=='undefined'?globalThis:this);

/* Brief percussion input samples. No correctness or completion cues. */
(() => {
  const key='nonogram-playtest-v1-sound-v1',files=new Map([[0,'sounds/input-x-tak.wav'],[1,'sounds/input-1-do.wav'],[2,'sounds/input-2-re.wav'],[3,'sounds/input-3-mi.wav'],[null,'sounds/input-erase-soft.wav']]);
  let enabled=true,context=null,epoch=0;
  const bytes=new Map(),buffers=new Map(),voices=new Set(),last=new Map();
  try{enabled=(globalThis.StackStorage||localStorage).getItem(key)!=='off';}catch{}
  const load=value=>{
    if(!bytes.has(value))bytes.set(value,fetch(files.get(value)).then(response=>{
      if(!response.ok)throw Error('Sound unavailable');
      return response.arrayBuffer();
    }).catch(()=>{bytes.delete(value);return null;}));
    return bytes.get(value);
  };
  const stop=()=>{epoch++;for(const voice of voices){try{voice.stop();}catch{}}voices.clear();};
  const prepare=()=>{
    if(!enabled)return null;
    const Audio=window.AudioContext||window.webkitAudioContext;
    if(!Audio)return null;
    try{
      context??=new Audio();
      if(context.state==='suspended')context.resume().catch(()=>{});
      for(const value of files.keys())if(!buffers.has(value)){
        const pending=load(value).then(data=>data?context.decodeAudioData(data.slice(0)):null).catch(()=>null);
        buffers.set(value,pending);
        pending.then(buffer=>{if(!buffer)buffers.delete(value);});
      }
      return context;
    }catch{return null;}
  };
  const play=value=>{
    if(!enabled||!files.has(value)||document.hidden)return;
    const now=Date.now();if(now-(last.get(value)??-Infinity)<45)return;
    last.set(value,now);
    const audio=prepare();if(!audio)return;
    const ticket=epoch;
    Promise.all([buffers.get(value),audio.state==='suspended'?audio.resume():Promise.resolve()]).then(([buffer])=>{
      if(!buffer||!enabled||ticket!==epoch||document.hidden||Date.now()-now>180||audio.state!=='running')return;
      try{
        if(voices.size>=4){const oldest=voices.values().next().value;oldest.stop();voices.delete(oldest);}
        const source=audio.createBufferSource();source.buffer=buffer;
        source.connect(audio.destination);
        source.onended=()=>{voices.delete(source);source.disconnect();};
        voices.add(source);source.start();
      }catch{/* Audio must never prevent puzzle input. */}
    }).catch(()=>{});
  };
  window.StackInputSound={play,get enabled(){return enabled;},setEnabled(value){
    enabled=!!value;last.clear();if(!enabled)stop();
    try{(globalThis.StackStorage||localStorage).setItem(key,enabled?'on':'off');}catch{}
  }};
  document.addEventListener('pointerdown',prepare,{capture:true,passive:true});
  document.addEventListener('keydown',prepare,{capture:true});
  document.addEventListener('visibilitychange',()=>{if(document.hidden)stop();});
  window.addEventListener('pagehide',stop);
  // Fetch the small assets early, but never create/play an audio context before a gesture.
  if(enabled&&(window.AudioContext||window.webkitAudioContext)&&typeof fetch==='function')for(const value of files.keys())load(value);
})();

window.installStackDpad=({dpad,buttons,move,apply,choose=()=>{}})=>{

(() => {

    root.append(section);
    const grid=section.querySelector('.page-overview-grid'),trigger=document.getElementById('page-number');
    // Grayscale cards omit palettes; always read the approved colors from color cards.
    const colorScroller=scrollers.find(scroller=>scroller.id==='color-games')||scrollers[0];
    const pages=colorScroller.children,buttons=[];let previousFocus=null,pinch=null,suppressClick=false;
    trigger.setAttribute('aria-label','페이지 한눈에 보기');trigger.setAttribute('aria-controls',section.id);trigger.setAttribute('aria-expanded','false');
    function addButtons(){for(let index=buttons.length;index<pages.length;index++){
      const button=document.createElement('button');button.type='button';button.className='page-overview-card';button.dataset.page=String(index+1);
      button.innerHTML=`<span class="card-number">${index+1}</span><span class="card-box"><canvas width="5" height="10" aria-hidden="true"></canvas></span>`;
      button.onclick=()=>{close(false);onSelect(index);scrollers.find(view=>!view.hidden)?.children[index]?.querySelector('.puzzle-card')?.focus({preventScroll:true});};
      grid.append(button);buttons.push(button);
    }}
    addButtons();
    function refresh(){
      addButtons();
      if(section.hidden)return;
      [...pages].forEach((page,index)=>{
        const button=buttons[index],ctx=button.querySelector('canvas').getContext('2d');let complete=0;
        ctx.fillStyle='#000000';ctx.fillRect(0,0,5,10);
        [...page.children].slice(0,50).forEach((card,slot)=>{
          if(card.dataset.state!=='complete')return;
          ctx.fillStyle=StackPalette.colors({subject:card.dataset.subject,categoryId:card.dataset.categoryId,colorPalette:card.dataset.palette?.split(',')},'color')[2];
          ctx.fillRect(slot%5,Math.floor(slot/5),1,1);complete++;

      });
    }
    function open(){
      if(!section.hidden||document.querySelector('dialog[open]'))return;
      previousFocus=document.activeElement;onOpen();section.hidden=false;root.classList.add('page-overview-open');trigger.setAttribute('aria-expanded','true');refresh();
    }
    function close(restoreFocus=true){
      if(section.hidden)return false;

      if(restoreFocus)(previousFocus?.isConnected&&previousFocus!==document.body?previousFocus:trigger).focus({preventScroll:true});

    }
    trigger.addEventListener('click',open);section.querySelector('.page-overview-close').onclick=()=>close();
    document.addEventListener('keydown',event=>{if(event.key==='Escape'&&!document.querySelector('dialog[open]')&&close()){event.preventDefault();}});
    const distance=touches=>Math.hypot(touches[0].clientX-touches[1].clientX,touches[0].clientY-touches[1].clientY);
    root.addEventListener('touchstart',event=>{
      if(event.touches.length===1&&!pinch){suppressClick=false;return;}
      if(event.touches.length!==2||pinch||document.querySelector('dialog[open]'))return;
      const initial=distance(event.touches);if(initial<20)return;
      pinch={initial,ids:[...event.touches].map(touch=>touch.identifier),overview:!section.hidden,handled:false};suppressClick=true;
    },{capture:true,passive:true});
    root.addEventListener('touchmove',event=>{
      if(!pinch)return;
      if(event.cancelable)event.preventDefault();event.stopPropagation();
      const touches=[...event.touches].filter(touch=>pinch.ids.includes(touch.identifier));
      if(touches.length!==2||pinch.handled)return;
      const ratio=distance(touches)/pinch.initial;
      if(!pinch.overview&&ratio<=.76){pinch.handled=true;open();}
      else if(pinch.overview&&ratio>=1.28){pinch.handled=true;close();}
    },{capture:true,passive:false});
    root.addEventListener('touchend',event=>{if(!pinch)return;if(event.cancelable)event.preventDefault();event.stopPropagation();if(!event.touches.length)pinch=null;},{capture:true,passive:false});
    root.addEventListener('touchcancel',()=>{pinch=null;},{capture:true,passive:true});
    root.addEventListener('click',event=>{if(!suppressClick)return;suppressClick=false;event.preventDefault();event.stopImmediatePropagation();},true);
    return {refresh,open,close,isOpen:()=>!section.hidden};
  }};
})();

        if(!page){
          page=scroller.children[0].cloneNode(false);page.className='puzzle-page';
          page.inert=false;page.removeAttribute('aria-hidden');page.hidden=true;
          page.dataset.page=String(index+1);scroller.append(page);
        }
        page.append(weeklyCard(scroller,record));
      }
      weeklyCount=records.length;showPage();refresh();
    }catch{/* Keep the last downloaded edition when offline. */}
    finally{checking=false;}
  }
  checkWeekly();
  addEventListener('online',checkWeekly);
  addEventListener('pageshow',event=>{if(event.persisted)checkWeekly();});
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkWeekly();});
})();
});</script></body></html>
